<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Duality | Vanguard Console</title>
    <style>
        body {
            background-color: #050b14;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        .header {
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .panel {
            background-color: #0d1117;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.1);
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #8b949e;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 5px;
        }
        .data-point {
            font-size: 1.5em;
            color: #3fb950;
            font-weight: bold;
            margin: 10px 0;
        }
        .status-secure {
            color: #3fb950;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>APEX Duality | Master Vanguard</h1>
        <p>Sovereign Node Connection: <span class="status-secure" id="connection-status">AWAITING DATA...</span></p>
    </div>

    <div class="hud-grid">
        <div class="panel">
            <h2>Core Telemetry</h2>
            <p>System Axiom:</p>
            <div class="data-point" id="axiom-display">--</div>
            <p>Thermal Core:</p>
            <div class="data-point" id="thermal-display">--</div>
        </div>

        <div class="panel">
            <h2>Optimus Prime Swarm</h2>
            <p>Ruling Queens Online:</p>
            <div class="data-point" id="queens-display">--</div>
            <p>Swarm State:</p>
            <div class="data-point" id="state-display">--</div>
        </div>
    </div>

    <script>
        // This function fetches data from our Python Ignition Server
        async function fetchTruth() {
            try {
                // 1. Grab Telemetry
                let telemetryResponse = await fetch('http://localhost:8000/api/telemetry');
                let telemetryData = await telemetryResponse.json();
                
                document.getElementById('axiom-display').innerText = telemetryData.axiom;
                document.getElementById('thermal-display').innerText = telemetryData.thermal_core;
                document.getElementById('connection-status').innerText = "LOCKED [200 OK]";

                // 2. Grab Agent Data
                let agentsResponse = await fetch('http://localhost:8000/api/agents');
                let agentsData = await agentsResponse.json();

                document.getElementById('queens-display').innerText = agentsData.ruling_queens;
                document.getElementById('state-display').innerText = agentsData.state;

            } catch (error) {
                console.error("Link severed:", error);
                document.getElementById('connection-status').innerText = "DISCONNECTED";
                document.getElementById('connection-status').style.color = "red";
            }
        }

        // Run it immediately, then update every 5 seconds
        fetchTruth();
        setInterval(fetchTruth, 5000);
    </script>

</body>
</html>
